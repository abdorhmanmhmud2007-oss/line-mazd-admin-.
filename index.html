<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Mazd - لوحة التحكم (Admin)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #fff; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #334155; margin-bottom: 30px; }
        h1 { color: #ef4444; font-size: 22px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        .stat-card h3 { font-size: 14px; color: #94a3b8; }
        .stat-card p { font-size: 24px; font-weight: bold; color: #38bdf8; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: right; border-bottom: 1px solid #334155; }
        th { background: #334155; color: #cbd5e1; }
        .btn-approve { background: #22c55e; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-reject { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
    </style>
</head>
<body>
    <header>
        <h1>لوحة إشراف Line Mazd</h1>
        <span>مرحباً بك يا مدير</span>
    </header>

    <div class="stats">
        <div class="stat-card"><h3>إجمالي الطلبات</h3><p>12</p></div>
        <div class="stat-card"><h3>طلبات تنتظر الموافقة</h3><p>3</p></div>
        <div class="stat-card"><h3>إجمالي الأرباح</h3><p>150.00 د.ل</p></div>
    </div>

    <h2>طلبات شحن الرصيد المعلقة</h2>
    <table>
        <thead>
            <tr>
                <th>اسم الزبون</th>
                <th>طريقة التحويل</th>
                <th>القيمة</th>
                <th>الإجراء</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>عبدالرحمن محمود</td>
                <td>سداد / MobiCash</td>
                <td>50.00 د.ل</td>
                <td>
                    <button class="btn-approve" onclick="alert('تمت الموافقة وإضافة الرصيد للزبون')">موافقة</button>
                    <button class="btn-reject" onclick="alert('تم رفض الطلب')">رفض</button>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
